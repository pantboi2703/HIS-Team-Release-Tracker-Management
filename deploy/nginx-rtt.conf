# Hospital LAN only. No cloud, no public exposure.
#
# Put this in /etc/nginx/sites-available/rtt and symlink it into sites-enabled.

server {
    listen 80;
    server_name rtt.local;   # or the server's LAN hostname / IP

    # Workbooks get large; the default 1m rejects a real release sheet.
    client_max_body_size 25m;

    # The built React app.
    root /opt/rtt/frontend;
    index index.html;

    # React Router owns the URL space, so every unknown path serves index.html
    # rather than 404 — otherwise a refresh on /all-items breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Export downloads are generated files, not streams; a minute is plenty.
        proxy_read_timeout 60s;
    }
}
